# ChainOSCPad / XIAO nRF52840
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# EC11 rotary encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Full consumer-control report for media keys
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y

# Keep ZMK Studio unlocked so no physical key must be dedicated to
# &studio_unlock on this small macropad.
CONFIG_ZMK_STUDIO_LOCKING=n
